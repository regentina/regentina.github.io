<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="35%" stop-color="#FFD6E8"/>
      <stop offset="70%" stop-color="#D9F5FF"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="vibrantGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="50%" stop-color="#FF9966"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" rx="36" fill="url(#heroBg)"/>

  <!-- Decorative Tropical & Search Vectors -->
  <circle cx="700" cy="120" r="140" fill="#FFEDD5" opacity="0.6"/>
  <circle cx="100" cy="880" r="180" fill="#E0F2FE" opacity="0.7"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g stroke="#0F172A" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="720" y1="0" x2="720" y2="1000"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- Editorial Silhouette Frame -->
  <g transform="translate(150, 160)" filter="url(#softShadow)">
    <rect width="500" height="640" rx="28" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#vibrantGlow)" stroke-width="3"/>
    
    <!-- Stylized Avatar Silhouette -->
    <g transform="translate(100, 70)">
      <!-- Head / Hair -->
      <circle cx="150" cy="140" r="95" fill="#FDA4AF" opacity="0.85"/>
      <circle cx="150" cy="140" r="85" fill="#F43F5E"/>
      <!-- Glasses / Smart Face Accent -->
      <circle cx="120" cy="135" r="24" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="180" cy="135" r="24" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M 144 135 L 156 135" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M 132 170 Q 150 185 168 170" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Torso / Blazer silhouette -->
      <path d="M 40 380 C 40 270, 260 270, 260 380 Z" fill="#0EA5E9" opacity="0.9"/>
      <path d="M 80 380 C 80 290, 220 290, 220 380 Z" fill="#0284C7"/>
      <!-- Camera / Notebook / Storyteller lanyard accent -->
      <path d="M 150 260 L 150 330" stroke="#F59E0B" stroke-width="6" stroke-dasharray="8 4"/>
      <rect x="132" y="325" width="36" height="26" rx="4" fill="#F59E0B"/>
    </g>

    <!-- Upload Marker & Instructions -->
    <g transform="translate(30, 480)">
      <rect width="440" height="120" rx="16" fill="url(#badgeGrad)"/>
      <text x="220" y="38" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">
        [PHOTO_SLOT_1_HERO_PORTRAIT]
      </text>
      <text x="220" y="66" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
        Rory Regentina • Editorial Portrait
      </text>
      <text x="220" y="94" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">
        TODO: Upload photo to assets/images/hero-portrait.jpg
      </text>
    </g>
  </g>

  <!-- Floating Corner Badges -->
  <g transform="translate(60, 240)" filter="url(#softShadow)">
    <rect width="180" height="54" rx="27" fill="#0D9488"/>
    <text x="90" y="33" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✨ 5+ Yrs SEO / AEO
    </text>
  </g>

  <g transform="translate(560, 720)" filter="url(#softShadow)">
    <rect width="180" height="54" rx="27" fill="#F97316"/>
    <text x="90" y="33" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      🌏 SE Asia Storyteller
    </text>
  </g>
</svg>

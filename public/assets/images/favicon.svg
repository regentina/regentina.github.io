<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
  </defs>
  <!-- Luxury dark background with fine hairline border -->
  <rect width="128" height="128" rx="30" fill="url(#darkBg)" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>
  <!-- Editorial Monogram 'R' in Crisp Ivory -->
  <text x="56" y="86" fill="#FFFFFF" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="76" font-weight="500" text-anchor="middle">R</text>
  <!-- Champagne Luxury Period Accent '.' -->
  <circle cx="90" cy="81" r="7" fill="#E5D5C5"/>
</svg>
